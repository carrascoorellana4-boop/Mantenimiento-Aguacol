name: Validar piloto push iPhone
on:
  push:
    branches: [feature/push-ios-prueba-admin]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check deploy/usermgr/push.mjs
      - run: node --check deploy/usermgr/server.mjs
      - run: node --check public/push-sw.js
