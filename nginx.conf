server {
  listen 127.0.0.1:8090;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 20m;

  location /rest/v1/ { proxy_pass http://127.0.0.1:3100/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /auth/v1/ { proxy_pass http://127.0.0.1:9999/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /api/users { proxy_pass http://127.0.0.1:3200; proxy_set_header Host $host; }
  # Sin Realtime en este despliegue: el cliente reintenta en silencio y la app sigue funcionando.
  location /realtime/v1/ { return 404; }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri /index.html; }
}
